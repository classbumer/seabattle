<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Морской Бой — Online</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
:root{--bg:#06101d;--panel:#0b1b2b;--line:#1b4c66;--cyan:#18e6ff;--green:#35ff91;--red:#ff4268;--gold:#ffd166;--muted:#89a8b9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#123454,#030811 55%);color:#eaf7ff;font-family:system-ui,Arial,sans-serif}
.app{width:min(100%,720px);margin:auto;padding:14px}
h1{font-size:clamp(25px,7vw,42px);letter-spacing:3px;text-align:center;margin:8px 0 4px;color:var(--cyan);text-shadow:0 0 20px #18e6ff55}
.sub{text-align:center;color:var(--muted);margin-bottom:15px}
.screen{display:none}.screen.active{display:block}
.card{background:linear-gradient(145deg,#0d2032ee,#071321ee);border:1px solid var(--line);box-shadow:0 12px 40px #0008;border-radius:18px;padding:18px;margin:12px 0}
button,input{font:inherit}
button{width:100%;padding:13px;border-radius:11px;border:1px solid var(--cyan);background:#092235;color:var(--cyan);font-weight:800;margin:6px 0}
button:active{transform:scale(.98)}button:disabled{opacity:.45}
button.red{border-color:var(--red);color:var(--red)}button.green{border-color:var(--green);color:var(--green)}
input{width:100%;padding:13px;background:#040b13;color:#fff;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:2px}
.row{display:flex;gap:8px}.row>*{flex:1}
.status{padding:10px;border-radius:10px;background:#06101b;border:1px solid var(--line);color:var(--muted);text-align:center;margin:8px 0}
.status.good{color:var(--green);border-color:#35ff9155}.status.bad{color:var(--red);border-color:#ff426855}
.code{font-size:24px;color:var(--gold);font-weight:900;letter-spacing:4px;word-break:break-all}
.setup-grid,.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:2px;width:min(92vw,360px);margin:auto;background:#02070d;padding:4px;border:1px solid var(--line);border-radius:10px}
.cell{aspect-ratio:1;background:#0b2637;border:1px solid #16445a;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:14px}
.cell.ship{background:#14708c;border-color:var(--cyan);box-shadow:inset 0 0 8px #18e6ff55}
.cell.hit{background:#8d1736;border-color:#ff6a89}.cell.hit:after{content:"×";font-size:20px;color:#fff;font-weight:900}
.cell.miss{background:#14212b}.cell.miss:after{content:"•";font-size:20px;color:#74a2b6}
.cell.sunk{background:#5b1027;border-color:var(--red)}
.radar .cell:not(.hit):not(.miss):not(.sunk){cursor:pointer}
.boards{display:grid;grid-template-columns:1fr;gap:14px}.board-title{text-align:center;font-weight:800;color:var(--cyan);margin:0 0 8px}
.info{display:flex;justify-content:space-between;gap:8px}.pill{padding:8px 10px;border:1px solid var(--line);border-radius:9px;text-align:center;flex:1}
.overlay{position:fixed;inset:0;background:#02060deF;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.overlay.show{display:flex}
.modal{width:min(100%,380px);background:#0b1b2b;border:2px solid var(--green);border-radius:18px;padding:25px;text-align:center}
.big{font-size:30px;color:var(--green);font-weight:900}
@media(min-width:650px){.boards{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<h1>МОРСКОЙ БОЙ</h1><div class="sub">ONLINE COMMAND</div>

<section id="menu" class="screen active">
<div class="card">
<h2>РЕЖИМЫ ИГРЫ</h2>
<button id="botMode">🤖 ИГРОК × БОТ</button>
<button id="humanMode">👤 ИГРОК × ИГРОК</button>
<button id="teamMode" class="green">👥 2 ИГРОКА × 2 БОТА</button>
</div>
<div class="card">
<h2>🌐 ОНЛАЙН</h2>
<button class="green" id="createBtn">СОЗДАТЬ ОНЛАЙН-ИГРУ</button>
<div id="hostBox" style="display:none">
<div class="status">Код комнаты:</div><div class="code" id="roomCode"></div>
<div class="status">Отправь код второму игроку</div>
</div>
<input id="joinCode" placeholder="КОД КОМНАТЫ">
<button id="joinBtn">ВОЙТИ ПО КОДУ</button>
<div id="netStatus" class="status">Сеть: не подключена</div>
</div>
</section>

<section id="setup" class="screen">
<div class="card">
<div class="info"><div class="pill" id="setupName"></div><div class="pill" id="setupMode"></div></div>
<h3 style="text-align:center">РАССТАНОВКА</h3>
<div id="setupGrid" class="setup-grid"></div>
<button id="randomBtn">СЛУЧАЙНАЯ РАССТАНОВКА</button>
<button id="readyBtn" class="green">ГОТОВ</button>
<div id="setupStatus" class="status">Расставьте флот</div>
</div>
</section>

<section id="battle" class="screen">
<div class="card">
<div class="info"><div class="pill" id="turnText">ХОД</div><div class="pill" id="connectionText">ИГРА</div></div>
<div class="status" id="battleInfo"></div>
</div>
<div class="boards">
<div class="card"><div class="board-title" id="myTitle">МОЙ ФЛОТ</div><div id="myGrid" class="grid"></div></div>
<div class="card"><div class="board-title" id="enemyTitle">РАДАР</div><div id="enemyGrid" class="grid radar"></div></div>
</div>
</section>
</div>

<div id="result" class="overlay"><div class="modal"><div class="big" id="resultTitle"></div><p id="resultText"></p><button onclick="location.reload()">НОВАЯ ИГРА</button></div></div>

<script>
const CONFIG={host:"seabattle-k1q4.onrender.com",path:"/peerjs",secure:true,port:443};
const FLEET=[4,3,3,2,2,2,1,1,1,1];
let mode="menu",players=[],turn=0,setupIndex=0,gameOver=false;
let peer=null,conn=null,role=null,myReady=false,remoteReady=false,online=false;

const $=id=>document.getElementById(id);
const empty=()=>Array.from({length:10},()=>Array(10).fill(0));
const newPlayer=(name,bot=false,team=0)=>({name,bot,team,grid:empty(),shots:empty(),ships:[]});
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active")}
function setNet(t,good=false,bad=false){$("netStatus").textContent=t;$("netStatus").className="status"+(good?" good":"")+(bad?" bad":"")}
function send(o){if(conn&&conn.open)conn.send(o)}

function setupPlayers(m){
 mode=m;online=false;gameOver=false;turn=0;setupIndex=0;
 if(m==="bot") players=[newPlayer("Игрок"),newPlayer("Бот",true,1)];
 if(m==="human") players=[newPlayer("Игрок 1"),newPlayer("Игрок 2")];
 if(m==="team") players=[newPlayer("Игрок 1",false,0),newPlayer("Игрок 2",false,0),newPlayer("Бот 1",true,1),newPlayer("Бот 2",true,1)];
 startSetup();
}
$("botMode").onclick=()=>setupPlayers("bot");
$("humanMode").onclick=()=>setupPlayers("human");
$("teamMode").onclick=()=>setupPlayers("team");

function canPlace(g,n,r,c,h){
 if(h&&c+n>10||!h&&r+n>10)return false;
 for(let i=0;i<n;i++){
  const R=h?r:r+i,C=h?c+i:c;
  for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
   const rr=R+dr,cc=C+dc;
   if(rr>=0&&rr<10&&cc>=0&&cc<10&&g[rr][cc])return false;
  }
 }
 return true
}
function randomFleet(p){
 p.grid=empty();p.shots=empty();p.ships=[];
 for(const n of FLEET){
  let done=false;
  while(!done){
   const h=Math.random()<.5,r=Math.floor(Math.random()*10),c=Math.floor(Math.random()*10);
   if(!canPlace(p.grid,n,r,c,h))continue;
   const cells=[];
   for(let i=0;i<n;i++){const R=h?r:r+i,C=h?c+i:c;p.grid[R][C]=1;cells.push([R,C])}
   p.ships.push({cells,hits:0});done=true;
  }
 }
}
function startSetup(){
 while(setupIndex<players.length&&players[setupIndex].bot){randomFleet(players[setupIndex]);setupIndex++}
 if(setupIndex>=players.length){startBattle();return}
 const p=players[setupIndex];
 randomFleet(p);show("setup");
 $("setupName").textContent=p.name;
 $("setupMode").textContent=mode==="team"?"2 ИГРОКА × 2 БОТА":mode==="bot"?"ПРОТИВ БОТА":"1 × 1";
 $("setupStatus").textContent="Проверьте флот и нажмите ГОТОВ";
 $("readyBtn").disabled=false;drawSetup();
}
function drawSetup(){
 const p=players[setupIndex],e=$("setupGrid");e.innerHTML="";
 for(let r=0;r<10;r++)for(let c=0;c<10;c++){
  const x=document.createElement("div");x.className="cell"+(p.grid[r][c]===1?" ship":"");e.appendChild(x);
 }
}
$("randomBtn").onclick=()=>{randomFleet(players[setupIndex]);drawSetup()};
$("readyBtn").onclick=()=>{
 $("readyBtn").disabled=true;
 if(online){myReady=true;send({type:"ready"});$("setupStatus").textContent="ГОТОВ. Ждём соперника...";if(remoteReady)startOnlineBattle();return}
 setupIndex++;startSetup();
};

function startBattle(){
 show("battle");turn=0;gameOver=false;
 $("connectionText").textContent=mode==="bot"?"БОЙ С БОТОМ":mode==="team"?"2 × 2":"1 × 1";
 renderBattle();
 if(players[turn].bot)setTimeout(botTurn,650);
}
function teamAlive(team){return players.filter(p=>p.team===team).some(p=>!allDead(p))}
function getTargets(p){
 if(mode==="team")return players.filter(x=>x.team!==p.team&&!allDead(x));
 return players.filter(x=>x!==p&&!allDead(x));
}
function currentTarget(p){
 const targets=getTargets(p);
 return targets[0];
}
function renderBattle(){
 const p=players[turn];
 $("turnText").textContent="ХОД: "+p.name;
 $("battleInfo").textContent=p.bot?"Бот выбирает цель...":"Выберите клетку противника";
 $("myTitle").textContent=p.name+" — флот";
 $("enemyTitle").textContent=mode==="team"?"ВРАГИ":"РАДАР";
 drawMy($("myGrid"),p);
 drawEnemy($("enemyGrid"),p);
}
function drawMy(el,p){
 el.innerHTML="";
 for(let r=0;r<10;r++)for(let c=0;c<10;c++){
  const x=document.createElement("div");x.className="cell";
  if(p.grid[r][c]===1)x.classList.add("ship");
  if(p.grid[r][c]===2)x.classList.add("miss");
  if(p.grid[r][c]===3)x.classList.add("hit");
  if(p.grid[r][c]===4)x.classList.add("sunk");
  el.appendChild(x);
 }
}
function drawEnemy(el,p){
 el.innerHTML="";
 const targets=getTargets(p);
 for(let r=0;r<10;r++)for(let c=0;c<10;c++){
  const x=document.createElement("div");x.className="cell";
  let shown=0;
  for(const t of targets)if(p.shots[r][c]===3||p.shots[r][c]===4)shown=p.shots[r][c];
  if(shown===3)x.classList.add("hit");
  if(shown===4)x.classList.add("sunk");
  if(p.shots[r][c]===2)x.classList.add("miss");
  if(!p.bot&&!gameOver&&p===players[turn]&&p.shots[r][c]===0)x.onclick=()=>playerShot(r,c);
  el.appendChild(x);
 }
}
function fire(attacker,target,r,c){
 if(target.grid[r][c]===1){
  target.grid[r][c]=3;
  const s=target.ships.find(s=>s.cells.some(([a,b])=>a===r&&b===c));
  if(s){s.hits++;if(s.hits===s.cells.length){s.cells.forEach(([a,b])=>target.grid[a][b]=4);return 4}}
  return 3;
 }
 target.grid[r][c]=2;return 2;
}
function allDead(p){return p.ships.length>0&&p.ships.every(s=>s.hits===s.cells.length)}
function playerShot(r,c){
 const attacker=players[turn];if(attacker.bot||gameOver||attacker.shots[r][c]!==0)return;
 const target=currentTarget(attacker);if(!target)return;
 const res=fire(attacker,target,r,c);attacker.shots[r][c]=res;
 afterShot(attacker,target,res);
}
function afterShot(attacker,target,res){
 if(checkVictory())return;
 if(res===2){
  turn=nextAliveIndex(turn);
 } // hit = same player keeps turn
 renderBattle();
 const p=players[turn];if(p.bot)setTimeout(botTurn,650);
}
function nextAliveIndex(i){
 for(let n=1;n<=players.length;n++){
  const j=(i+n)%players.length;
  if(!allDead(players[j]))return j;
 }
 return i;
}
function botTurn(){
 if(gameOver||!players[turn].bot)return;
 const bot=players[turn],targets=getTargets(bot);
 if(!targets.length)return;
 const target=targets[Math.floor(Math.random()*targets.length)];
 let r,c,tries=0;
 do{r=Math.floor(Math.random()*10);c=Math.floor(Math.random()*10)}while(bot.shots[r][c]!==0&&tries++<300);
 if(bot.shots[r][c]!==0){for(r=0;r<10;r++){let found=false;for(c=0;c<10;c++)if(bot.shots[r][c]===0){found=true;break}if(found)break}}
 const res=fire(bot,target,r,c);bot.shots[r][c]=res;
 afterShot(bot,target,res);
}
function checkVictory(){
 if(mode==="team"){
  const team0dead=!teamAlive(0),team1dead=!teamAlive(1);
  if(team0dead||team1dead){end(team0dead?"Боты победили":"Игроки победили");return true}
 }else{
  const alive=players.filter(p=>!allDead(p));
  if(alive.length<=1){end(alive[0].name+" победил");return true}
 }
 return false;
}
function end(text){
 gameOver=true;$("resultTitle").textContent=text;$("resultText").textContent="Бой окончен.";$("result").classList.add("show");
}

/* ONLINE 1x1 */
function newPeer(){
 return new Promise((resolve,reject)=>{
  peer=new Peer(undefined,CONFIG);
  peer.once("open",resolve);peer.once("error",reject);
  peer.on("disconnected",()=>setNet("Сервер соединения отключён",false,true));
 });
}
$("createBtn").onclick=async()=>{
 try{
  online=true;role="host";setNet("Подключение...");
  const id=await newPeer();
  $("roomCode").textContent=id;$("hostBox").style.display="block";
  setNet("Код создан. Ждём игрока...",true);
  peer.on("connection",c=>{conn=c;wire()});
  mode="online";players=[newPlayer("Игрок 1"),newPlayer("Игрок 2")];setupIndex=0;startOnlineSetup();
 }catch(e){setNet("Ошибка: "+(e.type||e.message),false,true)}
};
$("joinBtn").onclick=async()=>{
 const id=$("joinCode").value.trim();if(!id)return setNet("Введите код",false,true);
 try{
  online=true;role="guest";setNet("Подключение...");
  await newPeer();conn=peer.connect(id,{reliable:true});wire();
 }catch(e){setNet("Ошибка: "+(e.type||e.message),false,true)}
};
function startOnlineSetup(){
 show("setup");const p=players[role==="host"?0:1];setupIndex=role==="host"?0:1;
 randomFleet(p);$("setupName").textContent=p.name;$("setupMode").textContent="ONLINE 1 × 1";drawSetup();
 $("setupStatus").textContent="Проверьте флот и нажмите ГОТОВ";
}
function wire(){
 conn.on("open",()=>{
  setNet("Соперник подключён",true);
  if(role==="guest"){players=[newPlayer("Игрок 1"),newPlayer("Игрок 2")];startOnlineSetup()}
 });
 conn.on("data",onlineMessage);
 conn.on("close",()=>{if(!gameOver)setNet("Соперник отключился",false,true)});
}
function startOnlineBattle(){
 if(!myReady||!remoteReady)return;
 show("battle");gameOver=false;turn=role==="host"?0:1;renderOnline();send({type:"start",turn});
}
function renderOnline(){
 const p=players[role==="host"?0:1],opp=players[role==="host"?1:0];
 $("turnText").textContent=(turn===(role==="host"?0:1))?"ВАШ ХОД":"ХОД СОПЕРНИКА";
 $("connectionText").textContent="ONLINE";
 drawMy($("myGrid"),p);$("myTitle").textContent=p.name+" — флот";$("enemyTitle").textContent="РАДАР";
 const e=$("enemyGrid");e.innerHTML="";
 for(let r=0;r<10;r++)for(let c=0;c<10;c++){
  const x=document.createElement("div");x.className="cell";
  const v=p.shots[r][c];if(v===2)x.classList.add("miss");if(v===3)x.classList.add("hit");if(v===4)x.classList.add("sunk");
  if(turn===(role==="host"?0:1)&&!gameOver&&v===0)x.onclick=()=>onlineShot(r,c);e.appendChild(x)
 }
}
function onlineShot(r,c){
 const me=players[role==="host"?0:1];if(turn!==(role==="host"?0:1)||me.shots[r][c])return;
 me.shots[r][c]=1;send({type:"shot",r,c});renderOnline();
}
function onlineMessage(m){
 const myIndex=role==="host"?0:1,opIndex=1-myIndex;
 if(m.type==="ready"){remoteReady=true;if(myReady)startOnlineBattle();return}
 if(m.type==="start"){turn=m.turn;show("battle");renderOnline();return}
 if(m.type==="shot"){
  const me=players[myIndex],res=fire(me,me,m.r,m.c);
  send({type:"result",r:m.r,c:m.c,res});
  if(allDead(me)){send({type:"win"});showResultOnline(false);return}
  if(res===2)turn=opIndex;
  renderOnline();return
 }
 if(m.type==="result"){
  const me=players[myIndex];me.shots[m.r][m.c]=m.res;
  if(m.res===2)turn=opIndex;
  else turn=myIndex;
  renderOnline();return
 }
 if(m.type==="win"){showResultOnline(true);return}
}
function showResultOnline(win){
 gameOver=true;$("resultTitle").textContent=win?"ПОБЕДА!":"ПОРАЖЕНИЕ";
 $("resultText").textContent=win?"Вы уничтожили флот соперника.":"Соперник уничтожил ваш флот.";
 $("result").classList.add("show");
}
</script>
</body>
</html>
